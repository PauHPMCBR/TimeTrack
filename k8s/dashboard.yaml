# Kubernetes Dashboard access.
#
# SECURITY NOTE: the previous configuration granted `cluster-admin` to the
# dashboard service account and exposed it on a NodePort — that is equivalent
# to giving full cluster control to anyone who can reach the node. The default
# below grants only read-only (`view`) access and keeps the service internal.
# Access it with port-forward when needed:
#
#   kubectl port-forward svc/kubernetes-dashboard -n kubernetes-dashboard 8443:8443
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-viewer
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: dashboard-viewer
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard-nodeport
  namespace: kubernetes-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: 8443
  selector:
    k8s-app: kubernetes-dashboard
