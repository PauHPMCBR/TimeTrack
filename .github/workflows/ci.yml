name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck shared
        run: npm run typecheck -w @registre-jornada/shared

      - name: Typecheck backend
        run: npm run typecheck -w @registre-jornada/backend

      - name: Typecheck frontend
        run: npm run typecheck -w @registre-jornada/frontend

      - name: Tests
        run: npm run test:run

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.image }}/Dockerfile
          push: false
          tags: registre-jornada-${{ matrix.image }}:ci
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:3001

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
